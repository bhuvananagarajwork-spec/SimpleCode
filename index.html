<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Get Well Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

  <style>
    .serif { font-family: 'Playfair Display', serif; }
    .script { font-family: 'Dancing Script', cursive; }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(255,105,180,0.12), transparent 70%);
      z-index: -1;
    }

    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: all 1.4s ease;
    }
    .reveal.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body class="bg-gradient-to-b from-rose-200 via-pink-100 to-rose-50 text-gray-700 overflow-x-hidden">

  <!-- AUDIO -->
  <audio id="heartbeatAudio" preload="auto" loop playsinline>
    <source src="heartbeat.mp3" type="audio/mpeg">
  </audio>

  <!-- CONTENT -->
  <section class="min-h-screen flex items-center justify-center text-center px-6">
    <div>
      <h1 class="serif text-5xl text-rose-700 reveal">
        🤍 Get Well Soon, <span id="name">Ashok 💓</span>
      </h1>
      <p class="script text-3xl mt-6 reveal">Scroll slowly ↓</p>
    </div>
  </section>

  <section class="min-h-screen flex items-center justify-center text-center px-6">
    <div class="script text-4xl space-y-10">
      <p class="reveal">Come closer, love 💓</p>
      <p class="reveal">rest your tired heart beside mine.</p>
      <p class="reveal">You don’t have to be strong right now.</p>
    </div>
  </section>

  <section class="min-h-screen flex items-center justify-center text-center px-6">
    <div class="script text-4xl space-y-10">
      <p class="reveal">Breathe gently 🌸</p>
      <p class="reveal">I’m holding the quiet for you.</p>
    </div>
  </section>

  <!-- FINAL -->
  <section class="min-h-screen flex items-center justify-center text-center px-6">
    <div>
      <p id="finalLine" class="script text-4xl reveal">
        Get well soon, <span id="name2">Ashok</span> 😘
      </p>
      <p class="serif text-2xl text-rose-600 mt-10 reveal">
        🤗 Always with you — even in silence.
      </p>
    </div>
  </section>

  <!-- MUTE BUTTON -->
  <button
    id="muteBtn"
    class="fixed bottom-6 left-1/2 -translate-x-1/2
           bg-white/70 backdrop-blur-md
           px-5 py-2 rounded-full shadow-lg
           text-rose-600 text-sm serif"
  >
    🔊 Sound on
  </button>

  <script>
    /* NAME */
    const name =
      new URLSearchParams(window.location.search).get("name") || "Ashok";
    document.getElementById("name").textContent = name;
    document.getElementById("name2").textContent = name;

    /* REVEAL */
    const revealObserver = new IntersectionObserver(
      entries => entries.forEach(e => e.isIntersecting && e.target.classList.add("show")),
      { threshold: 0.3 }
    );
    document.querySelectorAll(".reveal").forEach(el => revealObserver.observe(el));

    /* AUDIO CORE */
    const audio = document.getElementById("heartbeatAudio");
    const muteBtn = document.getElementById("muteBtn");

    let started = false;
    let stopped = false;
    let muted = false;

    function startAudioOnce() {
      if (started || stopped) return;
      audio.volume = 0.25;
      audio.play().then(() => {
        started = true;
      }).catch(() => {});
    }

    document.addEventListener("touchstart", startAudioOnce, { once: true });
    document.addEventListener("click", startAudioOnce, { once: true });
    window.addEventListener("scroll", startAudioOnce, { once: true });

    /* 🔊 MUTE TOGGLE (FIXED) */
    muteBtn.addEventListener("click", () => {
      muted = !muted;
      audio.muted = muted;
      muteBtn.textContent = muted ? "🔇 Muted" : "🔊 Sound on";
    });

    /* 💓 SCROLL-BASED FADE + STOP */
    function handleScrollAudio() {
      if (!started || stopped) return;

      const scrollTop = window.scrollY;
      const scrollHeight = document.body.scrollHeight - window.innerHeight;
      const progress = Math.min(scrollTop / scrollHeight, 1);

      // Volume fades from 0.25 → 0.02
      audio.volume = Math.max(0.02, 0.25 * (1 - progress));

      // Stop at very end
      if (progress >= 0.98) {
        stopped = true;
        audio.volume = 0;
        audio.pause();
        audio.currentTime = 0;
        muteBtn.style.display = "none";
        window.removeEventListener("scroll", handleScrollAudio);
      }
    }

    window.addEventListener("scroll", handleScrollAudio);
  </script>

</body>
</html>
