<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Get Well Soon</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
  .serif { font-family: 'Playfair Display', serif; }
  .script { font-family: 'Dancing Script', cursive; }

  /* Visual heartbeat */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255,105,180,0.25), transparent 70%);
    opacity: var(--beat, 0.3);
    transition: opacity 0.25s ease;
    z-index: -1;
  }

  /* Rose petals */
  .petal {
    position: fixed;
    top: -10%;
    width: 14px;
    height: 20px;
    background: radial-gradient(circle at 30% 30%, #ffd1e8, #e75480);
    border-radius: 60% 40% 60% 40%;
    opacity: 0.45;
    animation: fall linear infinite;
    z-index: -1;
  }

  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(140vh) rotate(360deg); }
  }

  .petal-bed {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 90px;
    background: linear-gradient(to top, rgba(231,84,128,0.35), transparent);
  }
</style>
</head>

<body class="bg-gradient-to-b from-rose-300 via-pink-200 to-rose-100 text-gray-700 overflow-x-hidden">

<div class="petal left-[10%]" style="animation-duration:30s;"></div>
<div class="petal left-[30%]" style="animation-duration:34s;"></div>
<div class="petal left-[50%]" style="animation-duration:32s;"></div>
<div class="petal left-[70%]" style="animation-duration:36s;"></div>

<section class="min-h-screen flex items-center justify-center text-center px-6">
  <h1 class="serif text-4xl text-rose-700">
    🤍 Get Well Soon, Ashok
  </h1>
</section>

<section class="min-h-screen flex items-center justify-center text-center px-6">
  <p class="script text-3xl">
    Come here, love 🤍<br/>
    rest your tired heart next to mine.
  </p>
</section>

<section class="min-h-screen flex items-center justify-center text-center px-6">
  <p class="script text-3xl">
    Breathe slowly 🌸<br/>
    I’m right here 🤗
  </p>
</section>

<section class="min-h-screen flex items-center justify-center text-center px-6">
  <div>
    <p class="script text-4xl mb-8">
      Get well soon, Ashok 💞
    </p>
    <p class="serif text-xl text-rose-700">
      🤍 Feel my heartbeat with you
    </p>
  </div>
</section>

<div class="petal-bed"></div>

<script>
  // Heartbeat synced to scroll (iPhone safe)
  window.addEventListener("scroll", () => {
    const max = document.body.scrollHeight - innerHeight;
    const progress = window.scrollY / max;
    document.body.style.setProperty("--beat", 0.25 + progress * 0.45);
  });
</script>

</body>
</html>
