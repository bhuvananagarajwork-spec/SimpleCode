<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Get Well Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    .romantic {
      font-family: 'Playfair Display', serif;
    }
    .handwritten {
      font-family: 'Pacifico', cursive;
    }

    /* Gentle breathing animation */
    .breathe {
      animation: breathe 6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-[#fdecef]">

  <!-- Card -->
  <div class="w-[360px] h-[640px] bg-white rounded-[28px] shadow-xl px-8 py-12 text-center breathe">

    <!-- Title -->
    <h1 class="romantic text-2xl text-[#c94b6a] mb-8">
      Get Well Soon, <span id="name">Ashok</span>
    </h1>

    <!-- Main message -->
    <p class="handwritten text-2xl text-gray-700 leading-relaxed mb-10">
      Get well soon, <span id="name2">Ashok</span> 🤍<br/>
      I love you so much.
    </p>

    <!-- Affection -->
    <p class="romantic text-lg text-gray-600 mb-10">
      I wish I could wrap you in the<br/>
      warmest hug 🤗 and give you<br/>
      a thousand gentle kisses 😘
    </p>

    <!-- Divider -->
    <div class="w-12 h-[2px] bg-[#f1b7c4] mx-auto mb-10"></div>

    <!-- Closing -->
    <p class="handwritten text-lg text-[#c94b6a]">
      Rest, heal, and remember<br/>
      you are deeply loved 🌸
    </p>

    <!-- Signature -->
    <p class="mt-12 text-sm text-[#c94b6a]">
      — Always with love, for <span id="name3">Ashok</span>
    </p>

  </div>

  <!-- Editable name -->
  <script>
    const name = new URLSearchParams(window.location.search).get("name") || "Ashok";
    ["name","name2","name3"].forEach(id => {
      document.getElementById(id).textContent = name;
    });
  </script>

</body>
</html>
