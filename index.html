<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Get Well Soon, Ashok</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    .handwritten { font-family: 'Pacifico', cursive; }
    .romantic { font-family: 'Playfair Display', serif; }

    /* Soft glow */
    .glow {
      box-shadow: 0 0 40px rgba(255, 120, 170, 0.45);
    }

    /* Pulse for name */
    .pulse {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    /* Falling petals */
    .petal {
      position: absolute;
      bottom: -20px;
      width: 14px;
      height: 14px;
      background: radial-gradient(circle at 30% 30%, #ffc1d9, #ff5fa2);
      border-radius: 60% 40% 60% 40%;
      opacity: 0.7;
      animation: float 10s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
    }

    /* Flowers at bottom */
    .flower {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle at 30% 30%, #ff9acb, #ff4f93);
      border-radius: 50%;
      position: relative;
    }
    .flower::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 45px;
      background: #4caf50;
      bottom: -42px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 10px;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-b from-pink-300 via-pink-200 to-rose-200">

  <!-- Card -->
  <div class="relative w-[360px] h-[640px] bg-white/95 rounded-[36px] glow px-6 py-10 text-center overflow-hidden">

    <!-- Title -->
    <h1 class="romantic text-2xl text-rose-600 mb-4">
      Get Well Soon,
      <span id="name" class="pulse text-rose-700">Ashok</span> 💖
    </h1>

    <!-- Message -->
    <p class="handwritten text-2xl text-gray-700 leading-snug mb-6">
      Get well soon,
      <span id="name2" class="pulse text-rose-600">Ashok</span> 🤍<br/>
      I love you so much 😘
    </p>

    <!-- Hugs & kisses -->
    <p class="text-lg text-rose-500 mb-6">
      Sending you the biggest hugs 🤗<br/>
      and sweetest kisses 💋
    </p>

    <!-- Flowers -->
    <div class="flex justify-center gap-6 my-8">
      <div class="flower"></div>
      <div class="flower"></div>
      <div class="flower"></div>
    </div>

    <p class="handwritten text-lg text-rose-600">
      Each flower carries love,<br/>
      strength, and healing 🌸
    </p>

    <!-- Signature -->
    <p class="mt-8 text-sm text-rose-500">
      — Always with love, for <span id="name3">Ashok</span> 💌
    </p>

    <!-- Petals -->
    <div class="absolute inset-0 pointer-events-none">
      <div class="petal left-[10%]" style="animation-delay:0s"></div>
      <div class="petal left-[30%]" style="animation-delay:3s"></div>
      <div class="petal left-[55%]" style="animation-delay:6s"></div>
      <div class="petal left-[75%]" style="animation-delay:2s"></div>
    </div>
  </div>

  <!-- Editable Name -->
  <script>
    const n = new URLSearchParams(window.location.search).get("name") || "Ashok";
    ["name","name2","name3"].forEach(id => document.getElementById(id).textContent = n);
  </script>

</body>
</html>
